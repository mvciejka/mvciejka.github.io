<!doctype html>
<html lang="en" xmlns="http://www.w3.org/1999/html">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Maciej Kalemba (55715) - AI LAB B</title>
    <link rel="stylesheet" href="styles.css" type="text/css">
    <script src="scripts.js" defer></script>
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"/>
</head>
<body>
<div id="todo-list">
    <h1>To-Do List</h1>
    <div id="search-bar">
        <input type="text" id="search" placeholder="Wyszukaj zadanie">
    </div>
    <table id="task-list">
    </table>
    <table id="new-task-table">
        <tr id="new-task">
            <td class="task-title"><input type="text" id="new-task-input"
                                          pattern="[a-zA-Z0-9ąćęłńóśźżĄĆĘŁŃÓŚŹŻ\s]{3,255}"
                                          placeholder="Nowe zadanie"></td>
            <td class="task-date"><input type="date" id="new-task-date"></td>
            <td class="buttons">
                <button id="add-task">Add</button>
            </td>
        </tr>
    </table>
</div>
</body>
</html>
